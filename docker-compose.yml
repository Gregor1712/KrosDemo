name: krosdemo

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: krosdemo-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - krosdemo-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/KrosDemo.Api/Dockerfile
    container_name: krosdemo-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=KrosDB;User Id=sa;Password=Your_password123;TrustServerCertificate=true;Encrypt=false"
      JwtSettings__Secret: "DevOnly-LocalSecret-AtLeast32BytesLong-For-HMAC-SHA256"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: krosdemo-client
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  krosdemo-db-data: