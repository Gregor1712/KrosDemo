<mat-toolbar class="bgColor">
  <span class="brand">
    <span class="brand-mark"></span>
    KROS Demo
  </span>
  <nav>
    <a mat-button routerLink="/" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a mat-button routerLink="/invoices" routerLinkActive="active">Faktúry</a>
  </nav>

  <span class="spacer"></span>

  <div class="auth-actions">
    @if (auth.isLoggedIn()) {
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ auth.username() }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Odhlásiť sa</span>
        </button>
      </mat-menu>
    } @else {
      <button mat-button (click)="openAuthDialog('login')">
        <mat-icon>login</mat-icon>
        Prihlásiť
      </button>
      <button mat-stroked-button class="register-button" (click)="openAuthDialog('register')">
        <mat-icon>person_add</mat-icon>
        Registrovať
      </button>
    }
  </div>
</mat-toolbar>
